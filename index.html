<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json"><title>Nursing Digital Library</title><style>
body{margin:0;font-family:Arial;background:#f4f8f7;color:#17302e}header{background:#0f766e;color:white;padding:22px 16px;position:sticky;top:0}h1{margin:0 0 6px;font-size:24px}.sub{font-size:13px}.search{display:flex;gap:8px;margin-top:14px}.search input{flex:1;padding:12px;border:0;border-radius:10px}.search button,.back,.item button{border:0;border-radius:9px;padding:10px 13px;font-weight:bold}.search button{color:#0f766e}main{max-width:850px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.card,.item,.notice{background:white;border:1px solid #dce8e5;border-radius:14px;padding:15px}.card{cursor:pointer}.icon{font-size:25px}.card b{display:block;margin-top:7px}.small{font-size:12px;color:#647572;margin-top:4px}.hidden{display:none}.back{background:#e1efed;color:#115e59;margin-bottom:14px}.title{font-weight:bold}.list{display:flex;flex-direction:column;gap:10px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center}.item button{background:#0f766e;color:white}.section{font-size:19px;font-weight:bold;margin:10px 0 14px}footer{text-align:center;padding:30px;color:#647572;font-size:12px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head>
<body><header><h1>📚 Nursing Digital Library</h1><div class="sub">BS Nursing • Study resources in one place</div><div class="search"><input id="q" placeholder="Search books, slides, past papers..."><button onclick="googleSearch()">Google</button></div></header>
<main><section id="home"><div class="notice">Choose a semester. Each semester has regional slides and study resources.</div><div class="section">BS Nursing — Semesters</div><div class="grid" id="sem"></div></section>
<section id="semester" class="hidden"><button class="back" onclick="go('home')">← Semesters</button><div class="section" id="semTitle"></div><div class="grid" id="cats"></div></section>
<section id="resources" class="hidden"><button class="back" onclick="go('semester')">← Back</button><div class="section" id="resTitle"></div><div class="list" id="list"></div></section></main><footer>Nursing Digital Library • Free starter version</footer>
<script>
const regions=[["Peshawar Region Slides","📍"],["Mardan Region Slides","📍"],["Swat Region Slides","📍"],["Kohat Region Slides","📍"],["Hazara Region Slides","📍"]];
const cats=[["Notes","📝"],["Recommended Books","📚"],["Checklist","✅"],["Practice MCQs","🧠"],["Past Papers","📄"],["TA Series","📘"],["Four Nurses Book","📕"],["Grading System","📊"],["TOS / Curriculum","📋"]];
const subjects=["Anatomy & Physiology","Fundamentals of Nursing","Pharmacology","Microbiology","Pathology","Nutrition","Community Health Nursing","Medical-Surgical Nursing"];
let S=1,C="";
function go(id){["home","semester","resources"].forEach(x=>document.getElementById(x).classList.add("hidden"));document.getElementById(id).classList.remove("hidden");scrollTo(0,0)}
for(let i=1;i<=8;i++)document.getElementById("sem").innerHTML+=`<div class="card" onclick="openSem(${i})"><div class="icon">📘</div><b>Semester ${i}</b><div class="small">Regions • Notes • Books • MCQs • Past Papers</div></div>`;
function openSem(n){S=n;document.getElementById("semTitle").textContent="BS Nursing — Semester "+n;document.getElementById("cats").innerHTML=[...regions,...cats].map(x=>`<div class="card" onclick="openRes('${x[0]}')"><div class="icon">${x[1]}</div><b>${x[0]}</b><div class="small">Semester ${n}</div></div>`).join("");go("semester")}
function openRes(n){C=n;document.getElementById("resTitle").textContent=`Semester ${S} • ${n}`;document.getElementById("list").innerHTML=subjects.map(x=>`<div class="item"><div><div class="title">${x}</div><div class="small">Add your authorized Google Drive/PDF link here.</div></div><button onclick="web('${encodeURIComponent(x+' BS Nursing Semester '+S+' '+C)}')">Search</button></div>`).join("");go("resources")}
function web(q){location.href="https://www.google.com/search?q="+q}
function googleSearch(){let q=document.getElementById("q").value.trim();if(q)web(encodeURIComponent(q+" nursing BSN"))}
</script></body></html>
